<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Neon 2D Snake game with difficulty modes, bonus food, touch controls and a local leaderboard."
    />
    <meta name="theme-color" content="#05080a" />
    <title>Neon Snake | Saroj Dhital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Fredoka:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Neon Snake</h1>
        <p class="by">A project by Saroj Dhital</p>
      </header>

      <section class="stats" aria-live="polite">
        <div><span>Score</span><strong id="score">0</strong></div>
        <div><span>Best</span><strong id="best">0</strong></div>
        <div><span>Level</span><strong id="level">1</strong></div>
      </section>

      <section class="settings">
        <label
          >Difficulty
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="normal">Normal</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <label
          >Walls
          <select id="walls">
            <option value="solid">Solid (deadly)</option>
            <option value="wrap">Wrap around</option>
          </select>
        </label>
        <button id="soundBtn" type="button" aria-pressed="true">
          Sound: on
        </button>
        <button id="pauseBtn" type="button">Pause</button>
      </section>

      <div class="stage">
        <canvas id="game" aria-label="Snake game board"></canvas>
        <div id="overlay" class="overlay">
          <h2 id="ovTitle">Neon Snake</h2>
          <p id="ovMsg">
            Eat food, avoid walls and yourself. Gold food is worth 50.
          </p>
          <form id="saveForm" hidden>
            <input
              id="nameInput"
              maxlength="12"
              placeholder="Your name"
              autocomplete="off"
            />
            <button type="submit">Save score</button>
          </form>
          <button id="playBtn" type="button">Play</button>
          <p class="hint">Arrow keys / WASD, swipe, or D-pad. Space pauses.</p>
        </div>
      </div>

      <div class="dpad" aria-label="On-screen controls">
        <button data-dir="up" aria-label="Up">&#9650;</button>
        <button data-dir="left" aria-label="Left">&#9664;</button>
        <button data-dir="down" aria-label="Down">&#9660;</button>
        <button data-dir="right" aria-label="Right">&#9654;</button>
      </div>

      <section class="board">
        <h2>Leaderboard</h2>
        <div
          class="tabs"
          id="tabs"
          role="tablist"
          aria-label="Leaderboard difficulty"
        >
          <button type="button" role="tab" data-level="easy">Easy</button>
          <button type="button" role="tab" data-level="normal">Normal</button>
          <button type="button" role="tab" data-level="hard">Hard</button>
        </div>
        <ol id="scores"></ol>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
